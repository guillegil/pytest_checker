[project]
authors = [{ name = "Guillermo Gil", email = "guillegil@proton.me" }]
description = "Pytest Test Checker"
version = "0.1.0"
license = "MIT"
name = "pytest_checker"
readme = "README.md"
requires-python = ">=3.9"
urls = { homepage = "https://mypluginurl.com", repository = "https://github.com/guillegil/pytest-plugin-template" }
dependencies = [
    "pytest>=7",
    "advancedlogger @ git+https://github.com/guillegil/advanced-logger@develop",
    "pytest-meta @ git+https://github.com/guillegil/pytest-meta@develop",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.entry-points."pytest11"]
pytest-checker = "pytest_checker.plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytest_checker*"]

# [tool.setuptools.package-data]
# pytest-checker = ["mypackage-data/**/*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "advancedlogger @ git+https://github.com/guillegil/advanced-logger@develop",
    "pytest-meta @ git+https://github.com/guillegil/pytest-meta@develop",
]
